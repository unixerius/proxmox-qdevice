[supervisord]
nodaemon=true
user=root

# run sshd
[program:sshd]
# -e allows SSH logs to be sent to stderr, which is then sent to docker logs.
command=/usr/sbin/sshd -D -e
priority=200
# Pass SSH logs to Docker logs
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# run corosync-qnetd
[program:corosync-qnetd]
command=/usr/bin/corosync-qnetd -f
priority=200
# Pass COROSYNC logs to Docker logs
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
