[supervisord]
nodaemon=true
user=root

# run the ssh initialisation script
[program:init_ssh]
command=/usr/local/bin/init_ssh.sh
priority=100
autorestart=false
exitcodes=0
startsecs=0
startretries=0
# Pass echo statements to Docker logs
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# run sshd
[program:sshd]
command=/usr/sbin/sshd -D
priority=200
# Pass SSH logs to Docker logs
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# run corosync-qnetd
[program:corosync-qnetd]
command=/usr/bin/corosync-qnetd -f
priority=200
# Pass COROSYNC logs to Docker logs
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
